openapi: 3.0.3
info:
  title: Gestión de Personal por Centro
  version: 1.0.0
  description: API para centros, alta de trabajadores, fichajes de jornada y solicitudes de vacaciones.
servers:
  - url: /api
paths:
  /auth/login:
    post:
      summary: Autenticar usuario y obtener token con su rol
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /centers:
    get:
      summary: Listar centros
      tags: [Centers]
      security: []
      responses:
        '200':
          description: Lista de centros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Center'

  /centers/{id}/workers:
    get:
      summary: Listar los trabajadores de un centro
      tags: [Centers]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de trabajadores del centro
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Worker'
        '404':
          $ref: '#/components/responses/NotFound'

  /workers:
    get:
      summary: Listar trabajadores
      tags: [Workers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de trabajadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Worker'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Alta de un trabajador
      tags: [Workers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerCreateRequest'
      responses:
        '201':
          description: Trabajador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /workers/status:
    get:
      summary: Estado actual de todos los trabajadores
      tags: [Workers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de trabajadores con su estado actual
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /workers/login:
    post:
      summary: Iniciar sesión de un trabajador por PIN
      tags: [Workers]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Estado del trabajador autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /workers/{id}/status:
    get:
      summary: Estado actual de un trabajador por id
      tags: [Workers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado del trabajador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /workers/{id}/change-pin:
    post:
      summary: Cambiar el PIN de un trabajador
      tags: [Workers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePinRequest'
      responses:
        '204':
          description: PIN actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /workers/manage:
    get:
      summary: Listar todos los trabajadores del centro (activos e inactivos)
      tags: [Workers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de trabajadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Worker'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /workers/{id}/name:
    patch:
      summary: Renombrar un trabajador
      tags: [Workers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameWorkerRequest'
      responses:
        '204':
          description: Nombre actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /workers/{id}/reset-pin:
    post:
      summary: Resetear el PIN de un trabajador (fuerza cambio al entrar)
      tags: [Workers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetWorkerPinRequest'
      responses:
        '204':
          description: PIN reseteado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /workers/{id}/activate:
    patch:
      summary: Reactivar un trabajador inactivo
      tags: [Workers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Trabajador reactivado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /workers/{id}/deactivate:
    patch:
      summary: Dar de baja a un trabajador (no admin)
      tags: [Workers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Trabajador dado de baja
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /time-entries/start:
    post:
      summary: Registrar inicio de jornada
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryActionRequest'
      responses:
        '200':
          description: Fichaje iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /time-entries/pause:
    post:
      summary: Registrar pausa de jornada
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryActionRequest'
      responses:
        '200':
          description: Pausa registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /time-entries/end:
    post:
      summary: Registrar fin de jornada
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryActionRequest'
      responses:
        '200':
          description: Jornada finalizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /time-entries/resume:
    post:
      summary: Reanudar jornada en pausa
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryActionRequest'
      responses:
        '200':
          description: Jornada reanudada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /time-entries/today:
    get:
      summary: Estado actual y resumen del día
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      parameters:
        - name: workerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado actual y resumen del día
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodaySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /time-entries/monthly:
    get:
      summary: Resumen mensual por día
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      parameters:
        - name: workerId
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Resumen mensual del trabajador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /time-entries/quick-clock:
    post:
      summary: Fichaje rápido por trabajador y PIN
      tags: [TimeEntries]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickClockRequest'
      responses:
        '200':
          description: Resultado del fichaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickClockResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /time-entries/active/{workerId}:
    patch:
      summary: Editar la hora de inicio del fichaje activo
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditActiveRequest'
      responses:
        '204':
          description: Marcaje actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: Eliminar el último fichaje activo
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Marcaje eliminado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /time-entries/me:
    get:
      summary: Consultar fichajes propios
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fichajes del trabajador autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /time-entries:
    get:
      summary: Consultar fichajes de todos los trabajadores
      tags: [TimeEntries]
      security:
        - bearerAuth: []
      parameters:
        - name: workerId
          in: query
          schema:
            type: integer
          description: Filtrar por trabajador (opcional)
      responses:
        '200':
          description: Lista de fichajes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /vacations:
    get:
      summary: Listar ausencias del trabajador
      tags: [Vacations]
      security:
        - bearerAuth: []
      parameters:
        - name: workerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ausencias pendientes, aprobadas y denegadas, por fecha de inicio descendente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vacation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Crear solicitud de ausencia
      tags: [Vacations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacationCreateRequest'
      responses:
        '201':
          description: Solicitud creada (estado pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /vacations/center:
    get:
      summary: Listar ausencias no eliminadas del centro (gestión del admin)
      tags: [Vacations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ausencias del centro con su workerId
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vacation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /vacations/{id}:
    delete:
      summary: Eliminar (borrado lógico) una ausencia
      tags: [Vacations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VacationId'
      responses:
        '204':
          description: Ausencia eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vacations/{id}/approve:
    patch:
      summary: Aprobar solicitud de ausencia
      tags: [Vacations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VacationId'
      responses:
        '200':
          description: Solicitud aprobada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /vacations/{id}/reject:
    patch:
      summary: Denegar solicitud de ausencia
      tags: [Vacations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VacationId'
      responses:
        '200':
          description: Solicitud denegada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    VacationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Sin permisos (rol insuficiente)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Role:
      type: string
      enum: [admin, worker]

    Center:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    VacationStatus:
      type: string
      enum: [pending, approved, rejected, deleted]

    VacationType:
      type: string
      enum: [vacations, sick-leave, other]

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    WorkerCreateRequest:
      type: object
      required: [fullName, pin, role, centerId]
      properties:
        fullName:
          type: string
        pin:
          type: string
          pattern: '^\d{4}$'
        role:
          $ref: '#/components/schemas/Role'
        centerId:
          type: integer
        mustChangePin:
          type: boolean
          default: false

    LoginRequest:
      type: object
      required: [workerId, pin]
      properties:
        workerId:
          type: integer
        pin:
          type: string
          pattern: '^\d{4}$'

    ChangePinRequest:
      type: object
      required: [currentPin, newPin]
      properties:
        currentPin:
          type: string
          pattern: '^\d{4}$'
        newPin:
          type: string
          pattern: '^\d{4}$'

    RenameWorkerRequest:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string

    ResetWorkerPinRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: '^\d{4}$'

    Worker:
      type: object
      required: [id, fullName, role, centerId]
      properties:
        id:
          type: integer
        centerId:
          type: integer
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
        mustChangePin:
          type: boolean

    WorkerStatus:
      type: object
      required: [id, fullName, role, currentStatus]
      properties:
        id:
          type: integer
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        currentStatus:
          type: string
          enum: [idle, in-progress, paused, finished]
        startedAt:
          type: string
          format: date-time
        currentPausedAt:
          type: string
          format: date-time
        workedTime:
          type: string
          description: Duración en formato hh:mm:ss
        pausedTime:
          type: string
          description: Duración en formato hh:mm:ss
        dailyHours:
          type: string
          description: Horas diarias objetivo en formato hh:mm:ss
        mustChangePin:
          type: boolean
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineSegment'

    TimeEntry:
      type: object
      required: [id, workerId, status]
      properties:
        id:
          type: string
          format: uuid
        workerId:
          type: integer
        status:
          type: string
          enum: [in-progress, paused, finished]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        pauses:
          type: array
          items:
            $ref: '#/components/schemas/PausePeriod'

    PausePeriod:
      type: object
      required: [pausedAt]
      properties:
        pausedAt:
          type: string
          format: date-time
        resumedAt:
          type: string
          format: date-time

    TimeEntryActionRequest:
      type: object
      required: [workerId]
      properties:
        workerId:
          type: integer

    QuickClockRequest:
      type: object
      required: [workerId, pin, action]
      properties:
        workerId:
          type: integer
        pin:
          type: string
          pattern: '^\d{4}$'
        action:
          type: string
          enum: [start, pause, end]

    EditActiveRequest:
      type: object
      required: [start]
      properties:
        start:
          type: string
          format: date-time

    QuickClockResponse:
      type: object
      required: [success, message, availableActions]
      properties:
        success:
          type: boolean
        message:
          type: string
        currentStatus:
          type: string
          enum: [idle, in-progress, paused, finished]
        availableActions:
          type: array
          items:
            type: string
            enum: [start, pause, end]

    TodaySummary:
