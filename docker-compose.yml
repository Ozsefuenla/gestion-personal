services:
  postgres:
    image: postgres:17
    container_name: gestionpersonal-postgres
    environment:
      POSTGRES_DB: gestionpersonal
      POSTGRES_USER: gestionpersonal
      POSTGRES_PASSWORD: gestionpersonal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionpersonal -d gestionpersonal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
