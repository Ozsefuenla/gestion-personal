name: Release

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract SemVer from branch
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          if [[ ! "$branch" =~ ^release/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::La rama '$branch' no cumple release/vMAJOR.MINOR.PATCH."
            exit 1
          fi
          version="${branch#release/v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no tiene una sección ## [$VERSION]."
            exit 1
          fi

      - name: Check tag immutability
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$TAG")"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::El tag $TAG ya existe en $tag_sha y no se puede mover."
              exit 1
            fi
          fi

  tests:
    name: Tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/**/*.csproj

      - name: Restore
        run: dotnet restore src/GestionPersonal.slnx

      - name: Build
        run: dotnet build src/GestionPersonal.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test src/GestionPersonal.Tests/GestionPersonal.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Integration tests
        run: >
          dotnet test src/GestionPersonal.IntegrationTests/GestionPersonal.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore

  package:
    name: Package
    needs: [validate, tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/**/*.csproj

      - name: Restore
        run: dotnet restore src/GestionPersonal.slnx

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          dotnet publish src/GestionPersonal.Web/GestionPersonal.Web.csproj `
            -c Release `
            -p:Version=$version `
            -p:ContinuousIntegrationBuild=true `
            -o publish

      - name: Compress
        shell: pwsh
        run: |
          $tag = "${{ needs.validate.outputs.tag }}"
          Compress-Archive -Path "publish/*" -DestinationPath "GestionPersonal-$tag.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset
          path: GestionPersonal-*.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish release candidate
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-asset
          path: .

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push immutable tag
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || git push origin "$TAG"

      - name: Create or complete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          ASSET: GestionPersonal-${{ needs.validate.outputs.tag }}.zip
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$ASSET" \
              || gh release upload "$TAG" "$ASSET"
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --generate-notes \
              --prerelease
          fi

  deploy:
    name: Deploy production
    needs: [validate, publish-release]
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      mode: release
      reason: "Release ${{ needs.validate.outputs.tag }}"
    secrets: inherit
